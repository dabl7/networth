    h2 {
      color:white;
      font-family:Arial;
    }

    pre {
      color:white;
    }

    p {
      color:white;
    }

    body {
      background-color: rgb(35, 35, 35);
    }

    input {
      background-color: rgb(35, 35, 35);
      color:white;
    }

    label {
      color:white;
      font-family:Arial;
    }

    .grid-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .item {
      display: flex;
      align-items: center;
      width: 400px;
      height: 40px;
    }
    .image {
      margin-right: 10px;
      width: 40px;
      height: 40px;
      border-style: outset;
      border-width: 3px;
      border-color:rgb(71, 91, 125);
    }
    .input {
      width: 100px;
    }

    pre {
      font-size: 20px;
    }
  </style>
</head>
